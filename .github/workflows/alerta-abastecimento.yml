name: Alerta — Abastecimento pendente

on:
  schedule:
    # 7h BRT = 10:00 UTC
    - cron: "0 10 * * *"
    # 14h BRT = 17:00 UTC
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  alertar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar deps
        run: npm install --no-save @supabase/supabase-js tsx

      - name: Verificar e alertar
        run: npx tsx scripts/alerta-abastecimento.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Avisar se falhou
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode text="⚠️ Alerta abastecimento — falha na execução $(date -u +'%d/%m %H:%M')Z. Log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null
